        - 10-advertising.qmd
        - 12-sales.qmd
        - 13-clv.qmd
        - 14-celebrity-endorsement.qmd
        - 15-influencer-marketing.qmd
        - 16-nudges.qmd
        - 17-pricing.qmd
        - 18-service.qmd
        - 19-health.qmd
        - 20-gaming.qmd
        - 21-marketing-finance.qmd
        - 22-privacy.qmd
        - 04-innovation.qmd
        - 05-market-entry.qmd
        - 06-virality.qmd
    - part: parts/methodology.qmd
      chapters:
        - 23-metrics.qmd
        - 24-data.qmd
        - 25-modeling.qmd
        - 26-analytical-models.qmd
        - 27-empirical-models.qmd
        - 28-model-building.qmd
        - 29-structural-models.qmd
        - 30-measurement-scales.qmd
        - 31-surveys.qmd
        - 32-preference-measurement.qmd
        - 33-qualitative-research.qmd
        - 35-industrial-organization.qmd
        - 47-causal-inference.qmd
        - 50-choice-bayesian.qmd
        - 11-communication.qmd
    - part: parts/multimodal.qmd
      chapters:
        - 49-text-as-data.qmd
        - 07-sarcasm.qmd
        - 34-image-processing.qmd
        - 52-audio-voice.qmd
        - 53-video.qmd
        - 54-network-graph.qmd
        - 55-clickstream.qmd
        - 56-geospatial.qmd
        - 57-biometric-neuro.qmd
        - 58-multimodal-fusion.qmd
    - part: parts/seminars.qmd
      chapters:
        - 36-marketing-mix-models.qmd
        - 37-strategic-dynamic-models.qmd
