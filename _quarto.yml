    - part: "Case Studies"
      chapters:
        - 44-case-branding.qmd
        - 45-case-branding-instructor.qmd
        - 46-case-advertising.qmd
  appendices:
    - a1-others.qmd
    - 99-references.qmd

bibliography:
  - book.bib
  - book1.bib
  - references.bib
  - references1.bib
  - packages.bib
  - verified-additions.bib
  - syllabi-additions.bib
  - branding-additions.bib
  - multimodal-additions.bib
  - construct-additions.bib

crossref:
  chapters: true

format:
  html:
    theme: cosmo
    number-sections: true
    code-link: true
    code-fold: true
    code-tools: true
    code-summary: "Code"
    toc: true
    toc-depth: 3
  pdf:
    documentclass: scrbook
    number-sections: true
    keep-tex: true
    geometry:
      - top=30mm
      - left=25mm
      - right=25mm
      - bottom=30mm
  epub:
    number-sections: true

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    collapse: true
    comment: "#>"
    fig-align: center
    out-width: "85%"
