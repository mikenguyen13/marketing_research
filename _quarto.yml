project:
  type: book
  output-dir: _book

book:
  title: "Marketing Research"
  subtitle: "A Technical and Academic Treatment"
  author: "Mike Nguyen"
  favicon: favicon.svg
  search: true
  repo-url: https://github.com/mikenguyen13/marketing_research
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 01b-history-of-marketing-thought.qmd
    - part: "Constructs & Variables"
      chapters:
        - 02-construct-vs-variable.qmd
        - 03-satisfaction.qmd
        - 04-innovation.qmd
        - 05-market-entry.qmd
        - 06-virality.qmd
        - 07-sarcasm.qmd
    - part: "Substantive Domains"
      chapters:
        - 08-branding.qmd
        - 09-online-environments.qmd
        - 10-advertising.qmd
        - 11-communication.qmd
        - 12-sales.qmd
        - 13-clv.qmd
        - 14-celebrity-endorsement.qmd
        - 15-influencer-marketing.qmd
        - 16-nudges.qmd
        - 17-pricing.qmd
        - 18-service.qmd
        - 19-health.qmd
        - 20-gaming.qmd
        - 21-marketing-finance.qmd
        - 22-privacy.qmd
    - part: "Methodology"
      chapters:
        - 23-metrics.qmd
        - 24-data.qmd
        - 25-modeling.qmd
        - 26-analytical-models.qmd
        - 27-empirical-models.qmd
        - 28-model-building.qmd
        - 29-structural-models.qmd
        - 30-measurement-scales.qmd
        - 31-surveys.qmd
        - 32-preference-measurement.qmd
        - 33-qualitative-research.qmd
        - 34-image-processing.qmd
        - 35-industrial-organization.qmd
    - part: "Advanced Topics & Seminars"
      chapters:
        - 36-marketing-mix-models.qmd
        - 37-strategic-dynamic-models.qmd
        - 38-consumer-behavior-seminar.qmd
        - 39-analytical-modeling-seminar.qmd
        - 40-marketing-strategy-seminar.qmd
    - part: "Research Craft"
      chapters:
        - 41-scientific-writing.qmd
        - 42-review-process.qmd
        - 43-reporting.qmd
    - part: "Case Studies"
      chapters:
        - 44-case-branding.qmd
        - 45-case-branding-instructor.qmd
        - 46-case-advertising.qmd
  appendices:
    - a1-others.qmd
    - 99-references.qmd

bibliography:
  - book.bib
  - book1.bib
  - references.bib
  - references1.bib
  - packages.bib

crossref:
  chapters: true

format:
  html:
    theme: cosmo
    number-sections: true
    code-link: true
    toc: true
    toc-depth: 3
  pdf:
    documentclass: scrbook
    number-sections: true
    keep-tex: true
    geometry:
      - top=30mm
      - left=25mm
      - right=25mm
      - bottom=30mm
  epub:
    number-sections: true

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    collapse: true
    comment: "#>"
    fig-align: center
    out-width: "85%"
