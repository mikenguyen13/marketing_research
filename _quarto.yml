project:
  type: book
  output-dir: _book

book:
  title: "Marketing Research"
  subtitle: "A Technical and Academic Treatment"
  author: "Mike Nguyen"
  favicon: favicon.svg
  search: true
  repo-url: https://github.com/mikenguyen13/marketing_research
  repo-actions: [edit, issue]
  site-url: https://mike-marketing-research.share.connect.posit.cloud
  description: "A technical and academic treatment of marketing research: constructs, substantive domains, and the methods that connect them, with reproducible R code throughout."
  open-graph: true
  twitter-card: true
  google-analytics: "G-46EBZ61358"
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 01b-history-of-marketing-thought.qmd
