name: Publish to Posit Connect

# Renders the Quarto book and deploys it to Posit Connect.
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   CONNECT_SERVER   e.g. https://connect.yourorg.com
#   CONNECT_API_KEY  a Posit Connect API key with publish rights
# If either is missing, the deploy step is skipped (no failure), so this is safe
# to merge before the secrets exist. Deploy only happens after a successful render.
on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Chromium for Mermaid (PDF/EPUB diagrams)
        run: quarto install chromium --no-prompt || true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2

      # HTML only: every R-code chapter ships a committed _freeze/ cache, so this
      # render reuses it (no chapter R packages needed) and just rebuilds HTML +
      # Mermaid. The published artifact Posit serves is the HTML _book/; PDF/EPUB
      # re-execute uncached chapters on the fresh runner and are not the deploy path.
      - name: Render book (HTML; uses committed _freeze)
        run: quarto render --to html

      - name: Publish to Posit Connect
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: |
          # The live site is Posit Connect Cloud serving the committed _book/ from
          # master, so no API deploy is needed; report the skip as a notice, not a
          # warning, so successful runs carry no warning annotation.
          if [ -z "$CONNECT_SERVER" ] || [ -z "$CONNECT_API_KEY" ]; then
            echo "::notice::CONNECT_SERVER / CONNECT_API_KEY not set — skipping API deploy; Posit Connect Cloud serves the committed _book/ from master."
            exit 0
          fi
          quarto publish connect "$CONNECT_SERVER" --no-prompt --no-browser --no-render

      # build.yml (the "Build book" badge) is workflow_dispatch-only so it never
      # runs on its own, which leaves its badge stuck on whatever it last showed
      # -- keep it live by re-dispatching it here on every push.
      - name: Re-run Build book workflow to refresh its status badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref ${{ github.ref_name }}

  # GitHub Pages copy (https://mikenguyen13.github.io/marketing_research/).
  # Google indexes almost nothing on share.connect.posit.cloud (Search Console,
  # Nov 2026: 0 of 225 pages indexed), so the committed _book/ -- byte for byte
  # what Posit serves -- is also published here. site-url + canonical-url in
  # _quarto.yml make every page name this copy as canonical; Posit readers are
  # not redirected. Publishes the committed _book (no render), so both hosts
  # always carry the same files.
  github-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload committed _book
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
