name: Build book

# Verifies the Quarto book renders to HTML on a clean runner, reusing the
# committed _freeze/ caches (so no per-chapter R packages are needed), and
# uploads the rendered _book/ as an artifact. Manual only: Posit serves the
# committed _book/ from master, so this is a convenience build/verify step, not
# the deploy path. PDF/EPUB are intentionally not built here -- they re-execute
# uncached chapters that need the full local R/LaTeX toolchain; render those
# locally if needed.
on:
  workflow_dispatch:   # manual only

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Chromium for Mermaid diagrams
        run: quarto install chromium --no-prompt || true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies (lightweight; freeze supplies chapter outputs)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2

      - name: Render HTML (uses committed _freeze)
        run: quarto render --to html

      - name: Upload rendered book
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: _book
          if-no-files-found: ignore
