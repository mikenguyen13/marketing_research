name: Build book

# Verifies the Quarto book renders to HTML, PDF, and EPUB.
# Does NOT publish — deployment to Posit Connect is a separate, gated step.
on:
  push:
    branches: [master, main, quarto-migration]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Chromium for Mermaid (PDF/EPUB diagrams)
        run: quarto install chromium --no-prompt || true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages (resilient — tolerates archived/unavailable)
        run: |
          Rscript -e '
            pkgs <- c("knitr","rmarkdown","downlit","xml2","tidyverse","ggplot2",
              "dplyr","tidyr","purrr","purrrlyr","tibble","stringr","lubridate",
              "scales","kableExtra","broom","plm","MASS","zoo","reshape","reshape2",
              "plyr","plotly","ggrepel","ggthemes","gridExtra","RColorBrewer",
              "markovchain","topicmodels","conjoint","irr","DescTools","jsonlite",
              "rio","plotrix","expm","philentropy","visNetwork","rfm","gbm",
              "TraMineR","sfaR","frontier","GameTheory","ChannelAttribution","anchors");
            options(repos = "https://cloud.r-project.org");
            for (p in pkgs) try(if (!requireNamespace(p, quietly = TRUE)) install.packages(p))
          '

      - name: Render HTML
        run: quarto render --to html

      - name: Render PDF
        run: quarto render --to pdf

      - name: Render EPUB
        run: quarto render --to epub

      - name: Upload rendered book
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: _book
          if-no-files-found: ignore
